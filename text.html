<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>도서 관리 시스템</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .form-container {
            background: #f4f4f4;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .form-group label {
            width: 80px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            flex: 1;
            padding: 8px;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
        }

        button:hover {
            background: #0056b3;
        }

        button.danger {
            background: #dc3545;
        }

        button.danger:hover {
            background: #c82333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        th {
            background-color: #007BFF;
            color: white;
        }
    </style>
</head>

<body>

    <h1>📚 도서 관리 시스템</h1>

    <div class="form-container">
        <!-- 5개의 입력 필드 -->
        <div class="form-group">
            <label>도서명</label>
            <input type="text" id="title" placeholder="도서명 입력">
        </div>
        <div class="form-group">
            <label>저자</label>
            <input type="text" id="author" placeholder="저자 입력">
        </div>
        <div class="form-group">
            <label>카테고리</label>
            <select id="category">
                <option value="">선택하세요</option>
                <option value="Web">Web</option>
                <option value="AI">AI</option>
                <option value="Novel">Novel</option>
            </select>
        </div><!--form-container끝-->

        <div class="form-group">
            <label>가격</label>
            <input type="number" id="price" placeholder="가격 입력" min="0">
        </div>
        <div class="form-group">
            <label>재고</label>
            <input type="number" id="stock" placeholder="수량 입력" min="1">
        </div>
        <div style="text-align: right;">
            <button id="saveBtn">도서 추가</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>도서명</th>
                <th>저자</th>
                <th>카테고리</th>
                <th>가격</th>
                <th>재고</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody id="bookTableBody">
            <!-- 데이터가 렌더링 되는 곳 -->
        </tbody>
    </table>

    <script>
        // STEP 3: 초기 데이터 배열 구성
        let books = [
            { id: 1, title: "HTML 기초", author: "Kim", category: "Web", price: 15000, stock: 10 },
            { id: 2, title: "JavaScript 정석", author: "Lee", category: "Web", price: 25000, stock: 5 },
            { id: 3, title: "인공지능 개론", author: "Park", category: "AI", price: 30000, stock: 3 }
        ];

        let nextId = 4; // 다음 추가될 데이터의 ID
        let editId = null; // 현재 수정 중인 데이터의 ID (null이면 추가 모드)

        // DOM 요소
        const titleInput = document.getElementById('title');
        const authorInput = document.getElementById('author');
        const categoryInput = document.getElementById('category');
        const priceInput = document.getElementById('price');
        const stockInput = document.getElementById('stock');
        const saveBtn = document.getElementById('saveBtn');
        const bookTableBody = document.getElementById('bookTableBody');

        // STEP 6: 화면 갱신 함수 (Read)
        function render() {
            bookTableBody.innerHTML = ''; // 기존 내용 지우기


            books.forEach(book => {
                const tr = document.createElement('tr');//아래의 표시되는 것만 변경됨
                tr.innerHTML = `
                    <td>${book.id}</td>
                    <td>${book.title}</td>
                    <td>${book.author}</td>
                    <td>${book.category}</td>
                    <td>${book.price}원</td>
                    <td>${book.stock}개</td>
                    <td>                 //왜 버튼만 이렇게 쓰지?
                        <button onclick="editBook(${book.id})">수정</button>  //한번 클릭하념 어떻게 된다는거지?
                        <button class="danger" onclick="deleteBook(${book.id})">삭제</button>
                    </td>
                `;
                bookTableBody.appendChild(tr);//북테이블 바디에 tr이라는 요소를 생성하고 넣는건가?
            });
        }

        // STEP 9: Validation 검사
        function validateInput() {
            // 1. 필수 입력값 확인 (도서명 빈칸)
            if (titleInput.value.trim() === "") {
                alert("도서명을 입력하세요.");
                titleInput.focus();
                return false;
            }
            // 2. Select 선택 여부 확인
            if (categoryInput.value === "") {
                alert("카테고리를 선택하세요.");
                categoryInput.focus();
                return false;
            }
            // 3. 숫자 범위 확인 (가격이 0 미만인지)
            if (priceInput.value === "" || parseInt(priceInput.value) < 0) {
                alert("올바른 가격을 입력하세요 (0원 이상).");
                priceInput.focus();
                return false;
            }
            return true;
        }

        // 입력 폼 초기화 함수  >>어디다 쓰지?

        function resetForm() {
            titleInput.value = '';
            authorInput.value = '';
            categoryInput.value = '';
            priceInput.value = '';
            stockInput.value = '';
            editId = null;
            saveBtn.innerText = '도서 추가';
        }

        // STEP 5 & 7: 데이터 추가 및 수정 (Create / Update)
        saveBtn.addEventListener('click', function () {
            if (!validateInput()) return; // 유효성 검사 통과

            const bookData = {
                title: titleInput.value.trim(),
                author: authorInput.value.trim() || '미상',// 왼쪽 값이 비었다면 오른쪽 값을 넣어라
                category: categoryInput.value,
                price: parseInt(priceInput.value),
                stock: parseInt(stockInput.value) || 1
            };

            if (editId === null) {//edit함수 어디서 나왔지?
                // 추가 모드 (Create)
                bookData.id = nextId++;
                books.push(bookData); // 배열에 추가 >>.push
            } else {
                // 수정 모드 (Update)
                const index = books.findIndex(b => b.id === editId);//.findindex
                bookData.id = editId; // 기존 ID 유지
                books[index] = bookData; // 배열 수정
            }

            render(); // 화면 갱신
            resetForm(); // 폼 초기화
        });

        // STEP 7: 수정 버튼 클릭 시 폼에 데이터 표시 (Update 준비)
        window.editBook = function (id) { //window.editBook은 뭐냐?
            const book = books.find(b => b.id === id); // 배열에서 데이터 찾기 >> 찾는 원리 모름
            if (book) { //이건 무슨의미지? 
                titleInput.value = book.title;
                authorInput.value = book.author;
                categoryInput.value = book.category;
                priceInput.value = book.price;
                stockInput.value = book.stock;

                editId = id; // 현재 수정 중인 ID 저장
                saveBtn.innerText = '도서 수정완료';
            }
        };

        // STEP 8: 데이터 삭제 (Delete)
        window.deleteBook = function (id) {
            if (confirm("정말로 삭제하시겠습니까?")) {
                // 배열에서 해당 ID를 가진 데이터를 제외하고 새로운 배열 생성
                books = books.filter(b => b.id !== id);
                render(); // 화면 다시 그리기
            }
        };

        // 페이지 최초 실행 시 렌더링 >>>안하면 어떻게 되지?

        window.onload = render;//>>시작시 렌더하라는 뜻인가?

    </script>
</body>

</html>
