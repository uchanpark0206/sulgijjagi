<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀플 빈 시간 찾기 (여집합 방식)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: auto;
            background-color: #f4f7f6;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .date-group,
        .input-group {
            background: #fdfdfd;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        input,
        button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }

        button:hover {
            background-color: #2563eb;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #eff6ff;
            border-radius: 8px;
            border-left: 4px solid #2563eb;
        }

        ul {
            padding-left: 20px;
            margin: 10px 0;
        }

        .tag {
            display: inline-block;
            background: #e2e8f0;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>팀플 빈 시간 찾기 🔍</h2>
        <p>팀원들의 <b>'기존 일정(수업, 알바 등)'</b>을 입력하면, 일정이 없는 남는 시간을 계산해 줍니다.</p>

        <!-- 회의 기준일 설정 -->
        <div class="date-group">
            <label>📅 <b>회의를 할 날짜를 먼저 선택하세요</b></label>
            <input type="date" id="targetDate" required>
            <small>* 기본 회의 가능 시간은 해당일 오전 9시 ~ 오후 10시로 설정됩니다.</small>
        </div>

        <!-- 일정 입력 -->
        <div class="input-group">
            <label>❌ <b>팀원들의 불가능한 일정 입력</b></label>
            <input type="text" id="memberName" placeholder="이름 (예: 홍길동)" required>
            <input type="text" id="eventName" placeholder="일정 이름 (예: 전공 수업, 알바)" required>
            <label>일정 시작 시간:</label>
            <input type="time" id="startTime" required>
            <label>일정 종료 시간:</label>
            <input type="time" id="endTime" required>
            <button onclick="addSchedule()">일정 추가하기</button>
        </div>

        <h3>등록된 일정 현황</h3>
        <ul id="scheduleList"></ul>

        <div class="result-box">
            <h3>💡 모두가 비어있는 시간 (회의 가능 시간)</h3>
            <ul id="resultList">아직 계산된 결과가 없습니다.</ul>
        </div>
    </div>

    <!-- Supabase JS CDN 불러오기 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase 클라이언트 초기화
        const SUPABASE_URL = "https://mklzsynmolckpxqzdvue.supabase.co";
        const SUPABASE_KEY = "sb_publishable_MfYXMMdFXBd-nufUhkAqNw_bnRS9aPq";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 오늘 날짜를 기본값으로 세팅
        const targetDateInput = document.getElementById('targetDate');
        targetDateInput.valueAsDate = new Date();

        let busySchedules = [];

        // 날짜 변경 시 해당 날짜의 일정을 다시 불러오기
        targetDateInput.addEventListener('change', () => {
            loadSchedules();
        });

        // 0. Supabase에서 일정 목록 최신순으로 불러오기
        async function loadSchedules() {
            const targetDate = targetDateInput.value;
            if (!targetDate) return;

            const { data, error } = await supabaseClient
                .from('schedules')
                .select('*')
                .eq('target_date', targetDate)
                .order('created_at', { ascending: false });

            if (error) {
                console.error("일정 불러오기 실패:", error);
                alert("데이터를 불러오는 중 오류가 발생했습니다: " + error.message);
                return;
            }

            // DB에서 가져온 데이터를 화면 및 계산용 형식으로 변환
            busySchedules = (data || []).map(row => {
                // time 타입이 "HH:MM:SS" 형태일 수 있으므로 앞 5자리("HH:MM")만 사용
                const startStr = row.start_time.slice(0, 5);
                const endStr = row.end_time.slice(0, 5);
                return {
                    id: row.id,
                    name: row.member_name,
                    event: row.event_name,
                    start: new Date(`${row.target_date}T${startStr}`),
                    end: new Date(`${row.target_date}T${endStr}`)
                };
            });

            updateDOM();
            calculateFreeTime(targetDate);
        }

        // 1. 일정 추가 함수 (Supabase에 저장)
        async function addSchedule() {
            const targetDate = targetDateInput.value;
            const name = document.getElementById('memberName').value.trim();
            const eventName = document.getElementById('eventName').value.trim();
            const start = document.getElementById('startTime').value;
            const end = document.getElementById('endTime').value;

            if (!targetDate || !name || !eventName || !start || !end) {
                alert("모든 항목을 입력해주세요!");
                return;
            }

            if (start >= end) {
                alert("종료 시간은 시작 시간보다 늦어야 합니다.");
                return;
            }

            // Supabase schedules 테이블에 데이터 저장
            const { error } = await supabaseClient
                .from('schedules')
                .insert([
                    {
                        target_date: targetDate,
                        member_name: name,
                        event_name: eventName,
                        start_time: start,
                        end_time: end
                    }
                ]);

            if (error) {
                console.error("일정 저장 실패:", error);
                alert("일정 저장 중 오류가 발생했습니다: " + error.message);
                return;
            }

            // 입력창 초기화 (이름과 일정명만)
            document.getElementById('memberName').value = '';
            document.getElementById('eventName').value = '';

            // 저장 후 최신 목록 다시 불러오기
            await loadSchedules();
        }

        // 2. 화면에 등록된 일정 리스트 보여주기 (최신순)
        function updateDOM() {
            const list = document.getElementById('scheduleList');
            list.innerHTML = "";

            if (busySchedules.length === 0) {
                list.innerHTML = "<li>등록된 일정이 없습니다.</li>";
                return;
            }

            busySchedules.forEach(s => {
                const li = document.createElement('li');
                li.innerHTML = `<span class="tag">${s.name}</span> <b>${s.event}</b> : ${formatTime(s.start)} ~ ${formatTime(s.end)}`;
                list.appendChild(li);
            });
        }

        // 3. 빈 시간(여집합) 계산 로직
        function calculateFreeTime(targetDateString) {
            const resultList = document.getElementById('resultList');

            // 기준 시간: 해당 날짜의 09:00 ~ 22:00
            const boundaryStart = new Date(`${targetDateString}T09:00:00`);
            const boundaryEnd = new Date(`${targetDateString}T22:00:00`);

            if (busySchedules.length === 0) {
                resultList.innerHTML = "<li>✅ <b>09:00 ~ 22:00</b> (등록된 일정 없음)</li>";
                return;
            }

            // [핵심 1] 입력된 모든 일정을 시작 시간 순서대로 정렬
            let sortedSchedules = [...busySchedules].sort((a, b) => a.start - b.start);
            let mergedSchedules = [];

            // [핵심 2] 겹치는 일정들 하나로 병합 (예: A의 1~3시 수업, B의 2~4시 알바 -> 1~4시 바쁨)
            let current = { start: sortedSchedules[0].start, end: sortedSchedules[0].end };

            for (let i = 1; i < sortedSchedules.length; i++) {
                let next = sortedSchedules[i];
                if (current.end >= next.start) {
                    // 겹치면 끝나는 시간을 더 늦은 시간으로 갱신
                    current.end = new Date(Math.max(current.end, next.end));
                } else {
                    // 안 겹치면 현재까지 합쳐진 일정을 배열에 넣고 새로 시작
                    mergedSchedules.push(current);
                    current = { start: next.start, end: next.end };
                }
            }
            mergedSchedules.push(current);

            // [핵심 3] 기준 시간(09:00 ~ 22:00)에서 병합된 일정들을 빼고 빈 구간 찾기
            let freeTimes = [];
            let currentTime = boundaryStart;

            for (let busy of mergedSchedules) {
                if (currentTime < busy.start) {
                    freeTimes.push({ start: currentTime, end: busy.start });
                }
                currentTime = new Date(Math.max(currentTime, busy.end));
            }

            // 마지막 일정 끝난 후 ~ 밤 10시까지 남은 시간 추가
            if (currentTime < boundaryEnd) {
                freeTimes.push({ start: currentTime, end: boundaryEnd });
            }

            // [결과 출력]
            resultList.innerHTML = "";

            if (freeTimes.length === 0) {
                resultList.innerHTML = "<li>🥲 안타깝게도 모두가 비는 시간이 없습니다.</li>";
            } else {
                freeTimes.forEach(free => {
                    const li = document.createElement('li');
                    li.innerHTML = `✅ <b>${formatTime(free.start)} ~ ${formatTime(free.end)}</b>`;
                    resultList.appendChild(li);
                });
            }
        }

        // 시간 포맷팅 헬퍼 함수 (예: "14:30")
        function formatTime(date) {
            return date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
        }

        // 페이지 첫 로드 시 Supabase에서 일정 불러오기
        loadSchedules();
    </script>
</body>

</html>
