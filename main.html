<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀플 시간 조율기 (MVP)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: auto;
            background-color: #f9f9f9;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        input,
        button {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #45a049;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #eef2ff;
            border-radius: 8px;
            border-left: 4px solid #4f46e5;
        }

        ul {
            padding-left: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>팀플 교집합 시간 찾기 ⏰</h2>
        <p>팀원들의 가능한 시간을 입력하면, 모두가 모일 수 있는 겹치는 시간을 자동으로 계산합니다.</p>

        <div class="input-group">
            <input type="text" id="memberName" placeholder="이름 (예: 홍길동)" required>
            <label>가능한 시작 시간:</label>
            <input type="datetime-local" id="startTime" required>
            <label>가능한 종료 시간:</label>
            <input type="datetime-local" id="endTime" required>
            <button onclick="addTime()">시간 추가하기</button>
        </div>

        <h3>입력된 시간 현황</h3>
        <ul id="timeList"></ul>

        <div class="result-box">
            <h3>💡 추천 회의 시간</h3>
            <p id="resultText">아직 입력된 시간이 없습니다.</p>
        </div>
    </div>

    <script>
        // 팀원들의 입력 데이터를 저장할 배열
        let schedules = [];

        // 1. 입력받은 데이터를 배열에 추가하고 화면을 업데이트하는 함수
        function addTime() {
            const name = document.getElementById('memberName').value;
            const start = document.getElementById('startTime').value;
            const end = document.getElementById('endTime').value;

            if (!name || !start || !end) {
                alert("모든 항목을 입력해주세요!");
                return;
            }

            if (new Date(start) >= new Date(end)) {
                alert("종료 시간은 시작 시간보다 늦어야 합니다.");
                return;
            }

            schedules.push({
                name: name,
                start: new Date(start),
                end: new Date(end)
            });

            // 입력창 초기화
            document.getElementById('memberName').value = '';
            document.getElementById('startTime').value = '';
            document.getElementById('endTime').value = '';

            updateDOM();
            calculateOverlap();
        }

        // 2. DOM을 조작하여 입력된 리스트를 화면에 렌더링하는 함수
        function updateDOM() {
            const list = document.getElementById('timeList');
            list.innerHTML = ""; // 기존 목록 초기화

            schedules.forEach(s => {
                const li = document.createElement('li');
                li.textContent = `${s.name} : ${formatDate(s.start)} ~ ${formatDate(s.end)}`;
                list.appendChild(li);
            });
        }

        // 3. 교집합(모두가 겹치는 시간)을 계산하는 핵심 알고리즘
        function calculateOverlap() {
            if (schedules.length === 0) return;

            // 핵심 로직: 모든 시작 시간 중 '가장 늦은 시간'과 모든 종료 시간 중 '가장 이른 시간'을 찾음
            const maxStart = new Date(Math.max(...schedules.map(s => s.start)));
            const minEnd = new Date(Math.min(...schedules.map(s => s.end)));

            const resultText = document.getElementById('resultText');

            // 겹치는 구간이 존재하는 경우 (가장 늦은 시작 시간이 가장 이른 종료 시간보다 앞설 때)
            if (maxStart < minEnd) {
                resultText.innerHTML = `<strong>모두가 가능한 시간:</strong><br><br>🟢 ${formatDate(maxStart)} 부터<br>🔴 ${formatDate(minEnd)} 까지`;
                resultText.style.color = "#15803d"; // 초록색 텍스트
            } else {
                resultText.innerHTML = "안타깝게도 모두가 겹치는 시간이 없습니다. 일정을 다시 조정해 보세요. 🥲";
                resultText.style.color = "#b91c1c"; // 빨간색 텍스트
            }
        }

        // 날짜 포맷팅 헬퍼 함수
        function formatDate(date) {
            return date.toLocaleString('ko-KR', {
                month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });
        }
    </script>
</body>

</html>
