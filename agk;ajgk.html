<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <title>Page Title</title>
  <style>
    body {
      background-color: bisque;

    }
  </style>
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

<body>

  <h1>This is a Heading</h1>
  <p>This is a paragraph.</p>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">로고</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="#">홈</a></li>
          <li class="nav-item"><a class="nav-link" href="#">소개</a></li>

        </ul>
      </div>
    </div>
  </nav>
  <div class="card" style="width: 18rem;">
    <img src="a.jpg" class="card-img-top" alt="...">
    <div class="card-body">
      <h5 class="card-title">제목</h5>
      <p class="card-text">설명 글</p>
      <a href="#" class="btn btn-primary">보기</a>
    </div>
  </div>
  <div class="mb-3">
    <label for="email" class="form-label">이메일</label>
    <input type="email" class="form-control" id="email">
  </div>
  <select class="form-select">...</select>
  <input type="checkbox" class="form-check-input">

  <div id="slide" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active"><img src="1.jpg" class="d-block w-100"></div>
      <div class="carousel-item"><img src="2.jpg" class="d-block w-100"></div>
    </div>
    <button class="carousel-control-prev" data-bs-target="#slide" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" data-bs-target="#slide" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal">열기</button>

  <div class="modal fade" id="myModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">제목</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">내용</div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 1. 모달을 여는 버튼 -->
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal">
    열기
  </button>

  <!-- 2. 모달 본체 (평소엔 숨겨져 있음) -->
  <div class="modal fade" id="myModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">삭제 확인</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">정말 삭제할까요?</div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
          <button class="btn btn-danger">삭제</button>
        </div>
      </div>
    </div>
  </div>

  <div class="accordion" id="faq">
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#a1">
          질문 1
        </button>
      </h2>
      <div id="a1" class="accordion-collapse collapse show" data-bs-parent="#faq">
        <div class="accordion-body">답변 1</div>
        <div class="accordion-body">답변 2</div>
      </div>
    </div>
  </div>

</body>

</html>
